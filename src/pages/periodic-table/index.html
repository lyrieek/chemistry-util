<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>元素周期表</title>
    <meta name="description" content="可按相态、分区与温度着色的交互式元素周期表，支持按名称、符号和序号搜索。" />
    <script>
      ;(() => {
        let saved = null
        try {
          saved = localStorage.getItem('theme')
        } catch {
          /* file:// 或隐私模式下拿不到存储，继续用系统偏好 */
        }
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
    <link rel="stylesheet" href="/src/pages/periodic-table/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pages/periodic-table/index.tsx"></script>
  </body>
</html>
